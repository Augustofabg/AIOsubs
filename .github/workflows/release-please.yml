# ─────────────────────────────────────────────────────────────────────────────
# Release Please — Automated Semantic Versioning & Changelog
#
# Este workflow executa em todo push na branch main e mantém automaticamente
# um PR de release aberto. Após o merge desse PR:
#   1. Uma GitHub Release é criada com as release notes categorizadas
#   2. O package.json é versionado (major/minor/patch via Conventional Commits)
#   3. O CHANGELOG.md é atualizado com as seções Features, Bug Fixes, etc.
#
# Dependências obrigatórias em Settings > Actions > General:
#   ✅ "Allow GitHub Actions to create and approve pull requests"
#   ✅ Workflow permissions → "Read and write permissions"
# ─────────────────────────────────────────────────────────────────────────────

name: Release Please

on:
  push:
    branches:
      - main

# Permissões mínimas obrigatórias para que a action possa:
#   - Criar/atualizar o PR de release       → pull-requests: write
#   - Criar a GitHub Release e a tag git    → contents: write
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    # Outputs que permitem que outros jobs saibam se uma release foi criada
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      upload_url: ${{ steps.release.outputs.upload_url }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Tipo do release: "node" lê o package.json e atualiza a versão
          # automaticamente. Use "simple" se não quiser tocar no package.json.
          release-type: node

          # Token com escopo suficiente para abrir PRs e criar releases.
          # O GITHUB_TOKEN padrão funciona SE as permissões acima estiverem
          # configuradas corretamente nas Settings do repositório.
          token: ${{ secrets.GITHUB_TOKEN }}

          # Arquivo de configuração avançada (opcional — criado abaixo).
          # Descomente se usar .release-please-config.json.
          # config-file: .release-please-config.json
          # manifest-file: .release-please-manifest.json

  # ─────────────────────────────────────────────────────────────────────────
  # Job opcional: disparar o build Docker automaticamente após uma release.
  # Remove este job se não precisar dessa integração.
  # ─────────────────────────────────────────────────────────────────────────
  post-release:
    name: Post-release — Tag Docker Image
    needs: release-please
    runs-on: ubuntu-latest

    # Só executa quando o merge do PR de release de fato criou uma release
    if: ${{ needs.release-please.outputs.release_created }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Publica com a tag semântica (ex: v1.2.3) E sobrescreve o :latest
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiosubs:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository_owner }}/aiosubs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
